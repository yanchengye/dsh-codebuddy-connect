# The bundle's own Host plugin: the loopback status/key routes and the
# `codebuddy_connect` tool that both the sidebar panel and the agent call.
- insert:
    - id: dsh-codebuddy-connect
      name: dsh-codebuddy-connect

# Serves CodeBuddy's chat models through the shared pi-ai provider bridge.
#
# The base composition mounts `llm-pi-ai` dormant: no provider profiles, so no
# routes and no models in the picker. This row supplies exactly one profile,
# `codebuddy`, whose key resolves per request from the credentials service
# reference `CODEBUDDY_API_KEY`. Declaring the profile here (rather than through
# the Models settings page) keeps the route portable: the API key never lives in
# a file, only its reference name does.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      codebuddy:
        displayName: CodeBuddy
        api: openai-completions
        baseURL: https://copilot.tencent.com/v2
        apiKeyEnv: CODEBUDDY_API_KEY
        timeoutMs: 600000
        # CodeBuddy speaks the OpenAI chat-completions wire format, but not
        # OpenAI's own conventions: `role: "developer"` is rejected (11128) and
        # the token cap is spelled `max_tokens`. Both differ from what pi-ai
        # auto-detects for this hostname, so they are pinned here.
        compat:
          thinkingFormat: openai
          supportsReasoningEffort: true
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          supportsStore: false
          supportsLongCacheRetention: false
        models:
          # Reasoning-effort tables below record only the levels measured to
          # change behaviour upstream. `off: null` means "send no effort": the
          # route already answers without reasoning, and the literal string
          # "off" is rejected by the DeepSeek-V4 hosts (11133). `off: none` is
          # used where omitting the field still thinks upstream.
          - id: default
            name: Default · x2.00 · 68t/s
            contextWindow: 200000
            maxTokens: 24000
            input: [text]
          - id: deepseek-v4-pro
            name: DeepSeek-V4-Pro · x0.25 · 110t/s
            contextWindow: 1000000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts: { off: null, minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: deepseek-v4-flash
            name: DeepSeek-V4-Flash · x0.13 · 229t/s
            contextWindow: 1000000
            maxTokens: 50000
            input: [text, image]
